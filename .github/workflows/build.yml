# Builds the APK on GitHub's servers. Every push and pull request is built and tested;
# pushes to main also publish the APK on the repo's Releases page.
name: Build APK

on:
  push:
    branches-ignore: [screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Logic tests (no Android needed)
        run: bash tools/run_tests.sh
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk LocalBoard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalBoard-apk
          path: LocalBoard.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocalBoard build ${{ github.run_number }}
          files: LocalBoard.apk
