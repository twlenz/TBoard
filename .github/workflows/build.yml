# Builds the APK on GitHub's servers. Every push and pull request is built and tested;
# pushes to main also publish the APK on the repo's Releases page.
name: Build APK

on:
  push:
    branches-ignore: [screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # the default also asks for 'tools', which no longer exists
      - name: Logic tests (no Android needed)
        run: bash tools/run_tests.sh
      - name: Release signing key
        # Only pushes to main sign with the private key; other builds (and pull requests, which can't
        # read secrets) use the public test key. The key is created once, encrypted with the
        # LOCALBOARD_KEY_PASSWORD secret, and committed as app/release.keystore.
        id: key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          LOCALBOARD_KEY_PASSWORD: ${{ secrets.LOCALBOARD_KEY_PASSWORD }}
        run: |
          if [ -z "$LOCALBOARD_KEY_PASSWORD" ]; then
            echo "::warning::The LOCALBOARD_KEY_PASSWORD secret isn't set, so this release is signed with the PUBLIC test key."
            echo "kind=test" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#LOCALBOARD_KEY_PASSWORD} -lt 16 ]; then
            echo "::error::LOCALBOARD_KEY_PASSWORD must be at least 16 characters."
            exit 1
          fi
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -keystore app/release.keystore -storetype PKCS12 -alias localboard \
              -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=LocalBoard" \
              -storepass "$LOCALBOARD_KEY_PASSWORD" -keypass "$LOCALBOARD_KEY_PASSWORD"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/release.keystore
            git commit -m "Add the release signing key (encrypted with the LOCALBOARD_KEY_PASSWORD secret)"
            git push origin HEAD:main
          fi
          echo "kind=private" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          LOCALBOARD_KEY_PASSWORD: ${{ steps.key.outputs.kind == 'private' && secrets.LOCALBOARD_KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug assembleRelease   # lint: no APIs newer than minSdk without a version check
          cp app/build/outputs/apk/release/app-release.apk LocalBoard.apk
      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs LocalBoard.apk | tee signature.txt
          test_key=$(keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey | grep -o 'SHA-256.*' | sed 's/.*: //; s/://g' | tr 'A-F' 'a-f')
          signed=$(grep -m1 'certificate SHA-256 digest' signature.txt | sed 's/.*: //')
          if [ "${{ steps.key.outputs.kind }}" = "private" ] && [ "$signed" = "$test_key" ]; then
            echo "::error::The release should be signed with the private key but has the public test key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LocalBoard-apk
          path: LocalBoard.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocalBoard build ${{ github.run_number }}${{ steps.key.outputs.kind == 'test' && ' (test key)' || '' }}
          body: ${{ steps.key.outputs.kind == 'private' && 'Signed with the private LocalBoard key.' || 'Signed with the PUBLIC test key. Anyone can make an APK with this key that would install as an update, so set the LOCALBOARD_KEY_PASSWORD secret (see README) before relying on this build.' }}
          files: LocalBoard.apk
