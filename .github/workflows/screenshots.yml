# Runs the keyboard on Android emulators (the oldest supported version and a current one), types
# into it with injected touches, and saves screenshots to the "screenshots" branch
# (see tools/ci_screenshots.sh).
name: Screenshots

on:
  push:
    branches-ignore: [screenshots]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34      # Android 14, current phones
            target: google_apis
            arch: x86_64
          - api: 23      # Android 6.0, the oldest version LocalBoard supports
            target: default
            arch: x86    # the x86_64 image of this version crashes its own shell tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # the default also asks for 'tools', which no longer exists
      - name: Build debug APK and screenshot driver
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_screenshots.sh shots/api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-api${{ matrix.api }}
          path: shots

  publish:
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: shots
          merge-multiple: true
      - name: Push to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
