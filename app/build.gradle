plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.localboard'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.localboard'
        minSdk 23          // Android 6.0+; lint's NewApi check (CI) keeps newer APIs behind version checks
        targetSdk 34
        // each CI build gets a higher number, so Android can tell newer builds from older ones
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode build
        versionName "1.0.$build"
        // not a test framework: drives the keyboard on an emulator and takes screenshots (tools/ci_screenshots.sh)
        testInstrumentationRunner 'dev.localboard.shots.ShotRunner'
    }

    // Release builds published from main are signed with app/release.keystore, which is encrypted with
    // the LOCALBOARD_KEY_PASSWORD repository secret (see .github/workflows/build.yml). Without that
    // secret they fall back to the debug key below, which is public: anyone could sign an "update" with it.
    def releaseStore = file('release.keystore')
    def releasePassword = System.getenv('LOCALBOARD_KEY_PASSWORD')
    def privateKey = releaseStore.exists() && releasePassword

    signingConfigs {
        // Public test key, checked in so every test build installs over the previous one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (privateKey) {
            release {
                storeFile releaseStore
                storePassword releasePassword
                keyAlias 'localboard'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig privateKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    // targetSdk 34 is deliberate (see README); keep lint's store-policy checks from failing the build
    lint {
        checkReleaseBuilds false
        // CI runs lintDebug: any use of an API newer than minSdk without a version check fails the build
        checkOnly 'NewApi'
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
